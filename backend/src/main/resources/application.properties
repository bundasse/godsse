spring.application.name=godsse-backend

# HTTP port
server.port=8080

# CORS: 프론트엔드(Vite dev server) 오리진. 여러 개면 콤마로 구분한다.
app.cors.allowed-origins=http://localhost:5173

# Actuator: 헬스체크/정보만 노출
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# 데이터베이스 (개발용 H2 파일 DB)
# ---------------------------------------------------------------------------
# ./data/godsse.mv.db 파일에 저장되므로 재시작해도 데이터가 유지된다.
# (data/ 폴더는 backend/.gitignore 에서 제외되어 있다.)
spring.datasource.url=jdbc:h2:file:./data/godsse
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 엔티티(자바 클래스) 변경을 테이블에 자동 반영한다. 개발용이며, 배포 시에는
# validate 로 바꾸고 마이그레이션 도구(Flyway 등)를 사용한다.
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL 을 콘솔에 보기 좋게 출력한다(동작 학습용).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 화면 렌더링까지 DB 커넥션을 붙잡고 있는 기본 설정을 끈다.
# (지연 로딩 문제를 빨리 발견하기 위함 — doc/study 학습 노트 참고)
spring.jpa.open-in-view=false

# H2 웹 콘솔(개발용): http://localhost:8080/h2-console
# JDBC URL 에 위의 spring.datasource.url 값을 그대로 입력해 접속한다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# 파일 업로드 (프로필 이미지)
# ---------------------------------------------------------------------------
# 저장 위치(프로젝트 기준 상대 경로)와 파일 1개 최대 크기(바이트)
app.upload.dir=./uploads
app.upload.max-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------------------------------------------------------------------------
# 세션 (로그인 상태)
# ---------------------------------------------------------------------------
# 로그인 정보는 서버 메모리의 HttpSession 에 저장되고, 브라우저에는 세션 ID 쿠키(JSESSIONID)만 남는다.
# HttpOnly: 자바스크립트가 쿠키를 읽지 못하게 한다(XSS 로 세션 ID 탈취 방지).
server.servlet.session.cookie.http-only=true
# SameSite=Lax: 다른 사이트에서 시작된 요청에는 쿠키를 보내지 않는다(CSRF 완화).
server.servlet.session.cookie.same-site=lax
# 30분 동안 요청이 없으면 로그인 상태가 풀린다.
server.servlet.session.timeout=30m

# ---------------------------------------------------------------------------
# 오류 응답 (내부 정보 노출 방지)
# ---------------------------------------------------------------------------
# 처리되지 않은 예외의 스택 트레이스와 예외 클래스 이름을 응답에 포함하지 않는다.
server.error.include-stacktrace=never
server.error.include-exception=false

