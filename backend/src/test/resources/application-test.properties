# 테스트 프로파일에서만 적용되는 설정. (테스트 클래스에 @ActiveProfiles("test") 를 붙여 사용)
#
# 파일 이름이 application-test.properties 이므로, 기본 application.properties 를 "덮어쓰지 않고"
# 여기에 적은 항목만 덮어쓴다. (같은 이름의 application.properties 를 src/test/resources 에 두면
#  기본 설정이 통째로 대체되어 app.cors.allowed-origins 같은 값이 사라진다)
spring.datasource.url=jdbc:h2:mem:godsse-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 테스트는 매번 새 스키마로 시작하고, 끝나면 지운다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
